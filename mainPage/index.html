<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../mainpage/mainpage.css">
</head>

<body>
    <main>
        <article>
            <div class="artLeft">
                <div class="main notice">
                    <p class="titleText">공지사항</p>
                    <p class="plus">더보기 ></p>
                    <ul>
                        <li>2026-1학기 등록금 납부 및 분할 납부 신청 안내</li>
                        <li>2026학년도 신한카드 학생증 신청 안내</li>
                        <li>2026학년도 1학기 수업 운영 안내</li>
                        <li>2026학년도 1학기 추가학기 관련 안내</li>
                        <li>2026년도 1학기 수강신청 및 시간표 안내</li>
                    </ul>
                </div>
                <div class="main register">
                    <p class="titleText">수강신청 기간</p>
                    <div class="horiz">
                        <p class="date">26.02.25 ~ 26.02.28</p>
                        <button class="mainRegbtn" onclick="toregister()">수강신청</button>
                    </div>
                </div>
            </div>
            <div class="artRight">
                <div class="main myPage">
                    <div class="myPageTop">
                        <p class="titleText">내 정보</p>
                        <button class="mainRoombtn" onclick="tomypage()">마이페이지</button>
                    </div>
                    <ul>
                        <li><span id="label1">이름: </span><span id="val1"></span></li>
                        <li><span id="label2">학번: </span><span id="val2"></span></li>
                        <li><span id="label3">학과: </span><span id="val3"></span></li>
                        <li><span id="label4">학년: </span><span id="val4"></span></li>
                    </ul>
                </div>
                <div class="main lecture">
                    <p class="titleText">내 강의</p>
                    <ul id="lecture-list">

                    </ul>
                </div>
            </div>
        </article>
    </main>

    <script src="../mainpage/mainlecturelist.js"></script>
    <script>
        fetch("../layout/nosideheader.html") //header불러오기
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("../layout/footer.html") //footer불러오기
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })

        function toregister() {
            location.assign("../register/index.html");
        }

        function tomypage() {
            location.assign("../mypage/mypage_student.html");
        }

        var userLocal = localStorage.getItem('user');

        if (userLocal !== null) {
            var user = JSON.parse(userLocal);
            var role = user.userPosition;
            var name = user.userName;
            var id = user.userId;
            var major = user.userMajorId;
            var grade = user.userGrade;

            if (role === 'student') {
                document.querySelector('#val1').innerText = name;
                document.querySelector('#val2').innerText = id;
                document.querySelector('#val3').innerText = major;
                document.querySelector('#val4').innerText = grade;
            }
            else if (role === 'prof') {
                document.querySelector('#label2').innerText = '사번: ';
                document.querySelector('#val1').innerText = name;
                document.querySelector('#val2').innerText = id;
                document.querySelector('#val3').innerText = major;
                document.querySelector('#label4').style.display = "none";
                document.querySelector('#val4').style.display = "none";
            }
            else if (role === 'admin') {
                document.querySelector('#label2').innerText = '사번: ';
                document.querySelector('#val1').innerText = name;
                document.querySelector('#val2').innerText = id;
                document.querySelector('#label3').style.display = "none";
                document.querySelector('#val3').style.display = "none";
                document.querySelector('#label4').style.display = "none";
                document.querySelector('#val4').style.display = "none";
            }
        }
    </script>
</body>

</html>
