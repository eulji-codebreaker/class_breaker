<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../mainpage/mainpage.css">
</head>

<body>
    <main class="wrap">
        <article>
            <div class="artLeft">
                <div class="main notice">
                    <p class="titleText">공지사항</p>
                    <p class="plus">더보기 ></p>    <!--추후 버튼으로 수정-->
                    <ul>
                        <li>2026-1학기 등록금 납부 및 분할 납부 신청 안내</li>
                        <li>2026학년도 신한카드 학생증 신청 안내</li>
                        <li>2026학년도 1학기 수업 운영 안내</li>
                        <li>2026학년도 1학기 추가학기 관련 안내</li>
                        <li>2026년도 1학기 수강신청 및 시간표 안내</li>
                    </ul>
                </div>
                <div class="main register">
                    <p class="titleText">수강신청 기간</p>
                    <div class="horiz">
                        <p class="date">26.02.25 ~ 26.02.28</p>
                        <button class="mainRegbtn" onclick="toregister()">수강신청</button>
                    </div>
                </div>
            </div>
            <div class="artRight">
                <div class="main myPage">
                    <div class="myPageTop">
                        <p class="titleText">내 정보</p>
                        <button class="mainRoombtn" onclick="tomypage()">마이페이지</button>
                    </div>
                    <ul>
                        <li><span id="label1">이름: </span><span id="val1"></span></li>
                        <li><span id="label2">학번: </span><span id="val2"></span></li>
                        <li><span id="label3">학과: </span><span id="val3"></span></li>
                        <li><span id="label4">학년: </span><span id="val4"></span></li>
                    </ul>
                </div>
                <div class="main lecture">
                    <div class="mainlectureTop">
                        <p class="titleText">내 강의</p>
                        <button class="mainRoombtn" onclick="tolectureroom()">강의실 가기</button>
                    </div>
                    <ul id="lecture-list">
                    </ul>
                </div>
            </div>

            <div id="logout-confirm-modal" class="modal">
                <div class="modalContent">
                    <h2 class="modal-title">로그아웃</h2>
                    <p>정말 로그아웃 하시겠습니까?</p>
                    <div class="modal-btn-group">
                        <button type="button" id="real-logout-btn" class="modalbtn danger">로그아웃</button>
                        <button type="button" class="modalbtn" onclick="closeLogoutModal()">취소</button>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <script src="../mainpage/mainpage.js"></script>
</body>

</html>
