<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="basket.css">
    <link rel="stylesheet" href="/register/topbar.css">
    <link rel="stylesheet" href="/register_prof/all.css">
    <link rel="stylesheet" href="/src/css/ui/module/sidebar.css">
</head>

<body>
    <main>
        <aside>
            <div class="menu menu3 hover">마이페이지</div>
            <div class="menu menu4 hover">강의실</div>
            <div class="menu menu5 hover">수강신청</div>
            <div class="menu menu6 hover">공지사항</div>
        </aside>
        <article>
            <div class="topbar">
                <div>조회</div>
                <div>수강바구니</div>
                <div class="active">수강신청</div>
                <div>신청한 시간표</div>
            </div>

            <div class="Check">
                <div class="subjectHeader">
                    <div class="groupRadio">
                        <span>수강바구니 목록</span>
                        <input type="radio" name="subject" id="major" checked><label for="major">전공</label>
                        <input type="radio" name="subject" id="culture"><label for="culture">교양</label>
                    </div>
                </div>

                <div class="majorSelect">
                    <div class="option">
                        <select name="userMajorId" id="userMajorId">
                            <option value="" disabled selected hidden>학과를 선택해주세요.</option>
                            <option value="162">의료it학과</option>
                            <option value="158">빅데이터의료융합학과</option>
                            <option value="160">첨단학부</option>
                            <option value="123">간호학과</option>
                            <option value="119">응급구조학과</option>
                            <option value="238">임상병리학과</option>
                            <option value="130">방사선학과</option>
                            <option value="234">물리치료학과</option>
                            <option value="228">치위생학과</option>
                            <option value="888">안경광학과</option>
                        </select>
                    </div>


                    <div class="content">
                        <ul class="lectureList">
                        </ul>
                        <div class="subjectBasket">
                            <div class="basketHeader">
                                <span>수강신청 목록</span>
                            </div>
                            <div>
                                <ul class="lectureList">
                                </ul>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </article>
    </main>

    <div class="modal" id="clickresbtn">
        <div class="modalContent">
            <p class="modal-header"></p>
            <p class="delete">신청하시겠습니까?</p>
            <div class="btnGroup">
                <button type="submit" class="checkbtn">확인</button>
                <button type="submit" class="canclebtn">취소</button>
            </div>
        </div>
    </div>
    <div class="modal" id="clickbtn">
        <div class="modalContent">
            <p class="modal-header"></p>
            <p class="delete">취소하시겠습니까?</p>
            <div class="btnGroup">
                <button type="submit" class="checkbtn">확인</button>
                <button type="submit" class="canclebtn">취소</button>
            </div>
        </div>

    </div>
    <div class="modal" id="alertModal">
        <div class="modalContent">
            <p id="alertMessage" class="delete"></p>
            <div class="btnGroup">
                <button type="button" class="checkbtn" id="alertCloseBtn">확인</button>
            </div>
        </div>
    </div>


    <script>
        // 1. 데이터 정의
        const lectureData = [
            { id: 1, majorId: "162", lessonName: "창의적 의료 IT기기", lessonProf: "정동근", type: "전공", lessonpoint: 3 },
            { id: 2, majorId: "162", lessonName: "데이터베이스 이론과 실습", lessonProf: "김규동", type: "전공", lessonpoint: 3 },
            { id: 3, majorId: "162", lessonName: "건강정보의 이해", lessonProf: "ooo", type: "교양", lessonpoint: 2 },
            { id: 4, majorId: "158", lessonName: "빅데이터 분석", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 5, majorId: "162", lessonName: "프로그램 기초", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 6, majorId: "162", lessonName: "통계기초", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 7, majorId: "162", lessonName: "창의적사고와 코딩", lessonProf: "ooo", type: "교양", lessonpoint: 3 },
            { id: 8, majorId: "162", lessonName: "운영체제", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 9, majorId: "158", lessonName: "데이터 분석실무", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 10, majorId: "162", lessonName: "의료영상처리", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 11, majorId: "162", lessonName: "데이터베이스 기초", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 12, majorId: "162", lessonName: "조사방법론", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 13, majorId: "162", lessonName: "객체모델링", lessonProf: "ooo", type: "전공", lessonpoint: 2 },
            { id: 14, majorId: "162", lessonName: "파이썬프로그래밍", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 15, majorId: "162", lessonName: "범죄와 사회", lessonProf: "ooo", type: "교양", lessonpoint: 2 },
            { id: 16, majorId: "162", lessonName: "디자인의 이해", lessonProf: "ooo", type: "교양", lessonpoint: 2 },
            { id: 17, majorId: "162", lessonName: "서양철학의 이해", lessonProf: "ooo", type: "교양", lessonpoint: 3 },
            { id: 18, majorId: "162", lessonName: "경영학개론", lessonProf: "ooo", type: "교양", lessonpoint: 3 },
            { id: 19, majorId: "158", lessonName: "딥러닝", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 20, majorId: "158", lessonName: "인공지능프로그램", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 21, majorId: "158", lessonName: "딥러닝", lessonProf: "ooo", type: "전공", lessonpoint: 3 },
            { id: 22, majorId: "158", lessonName: "빅데이터처리", lessonProf: "ooo", type: "전공", lessonpoint: 3 }

        ];

        // 수강신청 목록 변수 (로컬스토리지에서 가져옴)
        let registered = JSON.parse(localStorage.getItem('registered')) || [];

        let targetLi = null;

        // 요소 선택
        const resModal = document.getElementById('clickresbtn');
        const delModal = document.getElementById('clickbtn');
        const alertModal = document.getElementById('alertModal');
        const alertMessage = document.getElementById('alertMessage');
        const alertCloseBtn = document.getElementById('alertCloseBtn');
        const basketList = document.querySelector('.content > .lectureList'); // 강의 조회 리스트
        const basketListUl = document.querySelector('.subjectBasket .lectureList'); // 수강신청 리스트
        const majorSelect = document.getElementById('userMajorId');
        const radioButtons = document.querySelectorAll('input[name="subject"]');

        function showAlert(message) {
            alertMessage.innerText = message;
            alertModal.style.display = 'flex';
        }


        // 1. 수강바구니(상단) 렌더링 함수 수정
        const basketRender = () => {
            const selectedMajor = majorSelect.value;
            // 라디오 버튼 값 가져오기 (전공/교양)
            const selectedType = document.querySelector('input[name="subject"]:checked')?.id === 'major' ? '전공' : '교양';

            // 로컬스토리지에서 바구니 데이터 가져옴
            const basketTextList = JSON.parse(localStorage.getItem('basket')) || [];

            // 필터링 조건 추가: 학과와 타입이 일치하는 것만
            const filteredBasket = basketTextList.filter(lecture => {
                return lecture.majorId === selectedMajor && lecture.type === selectedType;
            });

            basketList.innerHTML = ''; // 기존 리스트 초기화

            if (filteredBasket.length === 0) {
                basketList.innerHTML = '<li>해당 조건의 바구니 내역이 없습니다.</li>';
                return;
            }

            filteredBasket.forEach(lecture => {
                const li = document.createElement('li');
                li.innerHTML = `
            [${lecture.type}] | ${lecture.lessonName}  |  ${lecture.lessonProf}  |  ${lecture.lessonpoint}학점
            <button type="button" class="regbtn" data-id="${lecture.id}">신청하기</button>
        `;
                basketList.appendChild(li);
            });
        }

        // 2. 필터 변경 시 리렌더링 이벤트 연결
        majorSelect.addEventListener('change', () => {
            basketRender();
        });

        // 라디오 버튼(전공/교양)이 바뀌면 실행
        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                basketRender();
            });
        });

        basketRender();

        // 2.5.1 수강신청 목록(하단) 렌더링 함수
        function renderRegistered() {
            basketListUl.innerHTML = '';
            registered.forEach(lecture => {
                const li = document.createElement('li');
                li.innerHTML = `
            [${lecture.type}] | ${lecture.lessonName}  |  ${lecture.lessonProf}  |  ${lecture.lessonpoint}학점
            <button type="button" class="regbtn-delete" data-id="${lecture.id}">취소하기</button>
        `;
                basketListUl.appendChild(li);
            });
            localStorage.setItem('registered', JSON.stringify(registered));
        }
        renderRegistered(); 

        // 3. 강의 목록 렌더링 함수
        function renderLectures() {
            const selectedMajor = majorSelect.value;
            const selectedType = document.querySelector('input[name="subject"]:checked')?.id === 'major' ? '전공' : '교양';
            const filtered = lectureData.filter(l => l.majorId === selectedMajor && l.type === selectedType);

            lectureListUl.innerHTML = '';
            filtered.forEach(lecture => {
                const li = document.createElement('li');
                li.innerHTML = `
                [${lecture.type}] | ${lecture.lessonName}  |  ${lecture.lessonProf}  |  ${lecture.lessonpoint}학점
                <button type="button" class="regbtn" data-id="${lecture.id}">신청하기</button>
            `;
                lectureListUl.appendChild(li);
            });
        }


        // 5. 신청 버튼 클릭 (강의 목록 & 상단 바구니 공통)
        [basketList, document.querySelector('.lectureList')].forEach(list => {
            list.addEventListener('click', (e) => {
                if (e.target.classList.contains('regbtn')) {
                    targetLi = e.target.closest('li');
                    resModal.style.display = 'flex';
                }
            });
        });

        // 6. 신청 확인 버튼
        resModal.querySelector('.checkbtn').addEventListener('click', () => {
            if (targetLi) {
                const id = targetLi.querySelector('button').dataset.id;

                // 중복 체크
                if (registered.some(l => l.id == id)) {
                    resModal.style.display = 'none';
                    showAlert("이미 신청된 과목입니다.");
                    return;
                }

                const lecture = lectureData.find(l => l.id == id);
                registered.push(lecture); // 데이터 추가
                renderRegistered(); // 화면 갱신 및 저장

                resModal.style.display = 'none';
                showAlert("신청이 완료되었습니다.");
            }
        });

        // 7. 취소 버튼 클릭
        basketListUl.addEventListener('click', (e) => {
            if (e.target.classList.contains('regbtn-delete')) {
                targetLi = e.target.closest('li');
                delModal.style.display = 'flex';
            }
        });

        // 8. 취소 확인 버튼
        delModal.querySelector('.checkbtn').addEventListener('click', () => {
            if (targetLi) {
                const id = targetLi.querySelector('button').dataset.id;

                // 데이터 삭제
                registered = registered.filter(l => l.id != id);
                renderRegistered(); // 화면 갱신 및 저장

                delModal.style.display = 'none';
                showAlert("취소가 완료되었습니다.");
            }
        });

        // 9. 모든 '취소' 및 알림 '확인' 버튼 닫기 처리
        document.querySelectorAll('.canclebtn, #alertCloseBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                resModal.style.display = 'none';
                delModal.style.display = 'none';
                alertModal.style.display = 'none';
            });
        });

    </script>

    <script src="/js/register.js"></script>
</body>

</html>
