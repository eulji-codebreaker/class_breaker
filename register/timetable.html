    <script>
        // 요일 변환
        // 요일 숫자를 클래스명으로 변환
        function getDayClass(n) {
            // n이 문자열로 들어올 수 있으므로 숫자로 변환하여 체크
            return { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thr', 5: 'fri' }[Number(n)] || '';
        }

        // 시간표 렌더링 함수
        function renderStudentUI() {
            // 1. 데이터 가져오기 (키값이 'myLessons'인지 다시 한번 확인하세요)
            const myLessons = JSON.parse(localStorage.getItem('myLessons')) || [];

            console.log("불러온 강의 내역:", myLessons); // 데이터가 잘 오는지 콘솔에서 확인 가능

            // 2. 시간표 초기화 (기존 내용 지우기)
            document.querySelectorAll('.studentTimetable1 .timetableCol div:not(.fixedTime)').forEach(el => {
                el.innerText = '';
                el.style.backgroundColor = '';
                el.style.border = 'none'; // 테두리 초기화 (필요시)
            });

            // 3. 데이터 순회하며 시간표 채우기
            myLessons.forEach(l => {
                const dayClass = getDayClass(l.lessonDay);
                if (!dayClass) return;

                // 시작시간과 종료시간을 숫자로 변환 (예: 9시 -> index 1)
                const startHour = Number(l.lessonBegin);
                const endHour = Number(l.lessonEnd);

                // 8:00가 time0 이라면 -> startHour - 8
                const startIdx = startHour - 8;
                const endIdx = endHour - 8;

                for (let i = startIdx; i <= endIdx; i++) {
                    // 해당 요일과 교시에 맞는 셀 선택
                    const cell = document.querySelector(`.studentTimetable1 .${dayClass}.time${i}`);
                    if (cell) {
                        cell.innerText = l.lessonName;
                        cell.style.backgroundColor = '#F8F3FD';
                        cell.style.display = 'flex';
                        cell.style.alignItems = 'center';
                        cell.style.justifyContent = 'center';
                        cell.style.fontWeight = 'bold';
                        cell.style.fontSize = '12px';
                        cell.style.border = '1px solid #ddd'; // 셀 구분선
                    }
                }
            });

            // 4. 하단 테이블 목록 업데이트 (HTML에 .studentTimetable2 요소가 있을 경우)
            const tbody = document.querySelector('.studentTimetable2 tbody');
            if (tbody) {
                tbody.innerHTML = myLessons.map(l => {
                    let type = '교양';
                    if (l.lessonId.includes('m')) type = '전필';
                    else if (l.lessonId.includes('s')) type = '전선';

                    return `
                <tr>
                    <td>${type}</td>
                    <td>${l.lessonName}</td>
                    <td>Y</td>
                    <td>신청완료</td>
                </tr>
            `;
                }).join('');
            }
        }

        // [중요] 페이지 로드 시 함수 실행
        document.addEventListener('DOMContentLoaded', () => {
            renderStudentUI();
        });
    </script>
