<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="basket.css">
    <link rel="stylesheet" href="/register/topbar.css">
    <link rel="stylesheet" href="/register_prof/all.css">
    <link rel="stylesheet" href="/src/css/ui/module/sidebar.css">
</head>

<body>
    <main>
        <aside>
            <div class="menu menu3 hover">마이페이지</div>
            <div class="menu menu4 hover">강의실</div>
            <div class="menu menu5 hover">수강신청</div>
            <div class="menu menu6 hover">공지사항</div>
        </aside>

        <article>
            <div class="topbar">
                <div>조회</div>
                <div class="active">수강바구니</div>
                <div>수강신청</div>
                <div>신청한 시간표</div>
            </div>

            <div class="Check">
                <div class="subjectHeader">
                    <div class="groupRadio">
                        <span>강의 조회</span>
                        <input type="radio" name="subject" id="major" checked><label for="major">전공</label>
                        <input type="radio" name="subject" id="culture"><label for="culture">교양</label>
                    </div>
                </div>

                <div class="majorSelect">
                    <div class="option">
                        <select name="userMajorId" id="userMajorId">
                            <option value="" disabled selected hidden>학과를 선택해주세요.</option>
                            <option value="162">의료it학과</option>
                            <option value="158">빅데이터의료융합학과</option>
                            <option value="160">첨단학부</option>
                            <option value="123">간호학과</option>
                            <option value="119">응급구조학과</option>
                            <option value="238">임상병리학과</option>
                            <option value="130">방사선학과</option>
                            <option value="234">물리치료학과</option>
                            <option value="228">치위생학과</option>
                            <option value="888">안경광학과</option>

                        </select>
                    </div>

                    <div class="content">
                        <ul class="lectureList">
                        </ul>

                        <div class="subjectBasket">
                            <div class="basketHeader">
                                <span>수강바구니 목록</span>
                            </div>
                            <div>
                                <ul class="lectureList">
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </article>
    </main>

    <div class="modal" id="clickresbtn">
        <div class="modalContent">
            <p class="modal-header"></p>
            <p class="delete">신청하시겠습니까?</p>
            <div class="btnGroup">
                <button type="submit" class="checkbtn">확인</button>
                <button type="submit" class="canclebtn">취소</button>
            </div>
        </div>
    </div>
    <div class="modal" id="clickbtn">
        <div class="modalContent">
            <p class="modal-header"></p>
            <p class="delete">삭제하시겠습니까?</p>
            <div class="btnGroup">
                <button type="submit" class="checkbtn">확인</button>
                <button type="submit" class="canclebtn">취소</button>
            </div>
        </div>

    </div>
    <div class="modal" id="alertModal">
        <div class="modalContent">
            <p id="alertMessage" class="delete"></p>
            <div class="btnGroup">
                <button type="button" class="checkbtn" id="alertCloseBtn">확인</button>
            </div>
        </div>
    </div>
    <script>
        // 1. 초기 데이터 로드
        let basket = JSON.parse(localStorage.getItem('basket')) || [];
        const openedLessons = JSON.parse(localStorage.getItem('openedLessons')) || [];

        // 2. 유틸리티 함수
        const basketReload = () => localStorage.setItem('basket', JSON.stringify(basket));

        const majorCheck = (lessonId) => {
            const prefix = String(lessonId).slice(0, 3);
            return prefix === '999' ? 'culture' : 'major';
        };

        // 요소 선택
        const resModal = document.getElementById('clickresbtn');
        const delModal = document.getElementById('clickbtn');
        const alertModal = document.getElementById('alertModal');
        const alertMessage = document.getElementById('alertMessage');

        const lectureListUl = document.querySelector('.lectureList');
        const basketListUl = document.querySelector('.subjectBasket .lectureList');
        const majorSelect = document.getElementById('userMajorId');
        const radioButtons = document.querySelectorAll('input[name="subject"]');

        let targetLessonId = null; // 대상을 lessonId로 추적

        // 알림창 함수
        function showAlert(message) {
            alertMessage.innerText = message;
            alertModal.style.display = 'flex';
        }

        // 3. 수강바구니 렌더링 (화면 아래쪽 담긴 목록)
        function renderBasket() {
            basketListUl.innerHTML = '';
            basket.forEach(lecture => {
                const typeText = majorCheck(lecture.lessonId) === 'major' ? '전공' : '교양';
                const li = document.createElement('li');
                li.className = "lecture-item";
                li.innerHTML = `
            [${typeText}] | ${lecture.lessonName}  |  ${lecture.lessonProf}  |  ${lecture.lessonPoint}학점
            <button type="button" class="regbtn-delete" data-id="${lecture.lessonId}">취소하기</button>
        `;
                basketListUl.appendChild(li);
            });
        }

        // 4. 강의 목록 렌더링 (조회 결과)
        function renderLectures() {
            const selectedMajor = majorSelect.value;
            const selectedRadio = document.querySelector('input[name="subject"]:checked');
            if (!selectedRadio) return;

            const selectedType = selectedRadio.id; // 'major' 또는 'culture'

            const filtered = openedLessons.filter(l => {
                const type = majorCheck(l.lessonId);
                const prefix = String(l.lessonId).slice(0, 3);

                if (selectedType === 'culture') return type === 'culture';
                return type === 'major' && prefix === selectedMajor;
            });

            lectureListUl.innerHTML = '';
            if (filtered.length === 0) {
                lectureListUl.innerHTML = '<li style="padding:10px;">조회된 강의가 없습니다.</li>';
                return;
            }

            filtered.forEach(lecture => {
                const typeText = majorCheck(lecture.lessonId) === 'major' ? '전공' : '교양';
                const li = document.createElement('li');
                li.className = "lecture-item";
                li.innerHTML = `
            [${typeText}] | ${lecture.lessonName}  |  ${lecture.lessonProf}  |  ${lecture.lessonPoint}학점
            <button type="button" class="regbtn" data-id="${lecture.lessonId}">신청하기</button>
        `;
                lectureListUl.appendChild(li);
            });
        }

        // 5. 신청 로직
        lectureListUl.addEventListener('click', (e) => {
            if (e.target.classList.contains('regbtn')) {
                targetLessonId = e.target.dataset.id;
                resModal.style.display = 'flex';
            }
        });

        // 신청 확인 버튼
        resModal.querySelector('.checkbtn').onclick = () => {
            if (!targetLessonId) return;

            // 중복 체크
            if (basket.some(l => l.lessonId === targetLessonId)) {
                resModal.style.display = 'none';
                showAlert("이미 수강바구니에 담긴 강의입니다.");
                return;
            }

            // 데이터 찾기 및 추가
            const lecture = openedLessons.find(l => l.lessonId === targetLessonId);
            if (lecture) {
                basket.push(lecture);
                basketReload();
                renderBasket();
                resModal.style.display = 'none';
                showAlert("수강바구니에 담겼습니다.");
            }
        };

        // 6. 취소 로직
        basketListUl.addEventListener('click', (e) => {
            if (e.target.classList.contains('regbtn-delete')) {
                targetLessonId = e.target.dataset.id;
                delModal.style.display = 'flex';
            }
        });

        // 취소 확인 버튼
        delModal.querySelector('.checkbtn').onclick = () => {
            basket = basket.filter(l => l.lessonId !== targetLessonId);
            basketReload();
            renderBasket();
            delModal.style.display = 'none';
            showAlert("취소가 완료되었습니다.");
        };

        // 7. 공통 닫기 이벤트
        document.querySelectorAll('.canclebtn, #alertCloseBtn').forEach(btn => {
            btn.onclick = () => {
                resModal.style.display = 'none';
                delModal.style.display = 'none';
                alertModal.style.display = 'none';
            };
        });

        // 초기 실행
        majorSelect.addEventListener('change', renderLectures);
        radioButtons.forEach(radio => radio.addEventListener('change', renderLectures));
        renderBasket(); // 페이지 로드 시 바구니 목록 먼저 표시

    </script>
    <script src="/js/register.js"></script>
</body>

</html>
