            { lessonId: "999o02", lessonName: "심리학개론", lessonProf: "정교수", lessonProfId: "201015800", lessonMajorName: "교양학부", lessonGrade: 0, lessonMax: 50, lessonNow: 32, lessonRoom: "범석관101호", lessonDay: 2, lessonBegin: 15, lessonEnd: 17, lessonPoint: 2, lessonContent: "심리학 기초 이해" },
        ];

        //회원가입 할때 학과를 드롭다운으로 지정하기만 해도 각 value에 맞는 학과이름을 userInfoGroup에 넣기위해 만듦
        const majorMap = {
            162: '의료it학과',
            158: "빅데이터의료융합학과",
            160: "첨단학부",
            123: "간호학과",
            119: "응급구조학과",
            238: "임상병리학과",
            130: "방사선학과",
            234: "물리치료학과",
            228: "치위생학과",
            888: "안경광학과",
            999: "관리자"
        }



        //로컬스토리지에 더미데이터 넣기
        localStorage.setItem('openedLessons', JSON.stringify(dummy));
        localStorage.setItem('myLessons', JSON.stringify(mydummy));
        localStorage.setItem('userInfoGroup', JSON.stringify(userInfoGroup));

        //현재 페이지 표시(현재로서는 필요없지만 추후에 필요할일이 생길까하여)
        localStorage.setItem('pageNow', 'login');



        /*로그인 로그인 로그인 로그인 로그인 로그인 로그인 로그인 로그인*/
        //로그인 폼 제출 과정
        loginForm.addEventListener("submit", function (e) {
            e.preventDefault();

            if (loginUserId.value.trim() === "") {
                loginUserId.focus();
                return;
            }

            if (loginUserPwd.value.trim() === "") {
                loginUserPwd.focus();
                return;
            }

            for (var i in userInfoGroup) {
                if (userInfoGroup[i].userId == loginUserId.value && userInfoGroup[i].userPwd == loginUserPwd.value) {
                    logincompleteModal.style.display = "flex";
                    localStorage.setItem('user', JSON.stringify(userInfoGroup[i]));
                    return;
                }
            }

            alert('유효하지 않은 회원정보입니다.');


        });


        /*회원가입 회원가입 회원가입 회원가입 회원가입 회원가입 회원가입*/
        const wrongInput = (e) => { //회원가입 폼에서 잘못된 입력 있을 경우 서식을 바꾸기 위해 이용
            e.focus();
            e.classList.add('wrong');
        }

        //회원가입 누르면 회원가입 모달창 띄우기
        loginUserBtn.addEventListener("click", function () {
            idRegModal.style.display = "flex";
        });
        var closemodal = () => document.querySelectorAll('.modal').forEach(e => { e.style.display = 'none'; });

        //회원가입 창에서 직책 드롭다운 바뀔때 아이디 placeholder 바꾸기
        userPosition.addEventListener("change", function () {
            if (userPosition.value === "student") {
                userId.placeholder = "yyyymmmiii";
            } else if (userPosition.value === "prof") {
                userId.placeholder = "yyyymmmii";
            } else if (userPosition.value === "admin") {
                userId.placeholder = "yyyyiii";
            }
        });

        //회원가입 폼 제출 과정(유효성 체크 등)
        idRegRealForm.addEventListener("submit", function (e) {
            e.preventDefault();
            let genderChecked = false;
            idRegRealForm.querySelectorAll('.wrong').forEach((el) => {
                el.classList.remove('wrong');
            });


            for (let i = 0; i < userGenderList.length; i++) {
                if (userGenderList[i].checked) {
                    genderChecked = true;
                }
            }

            if (userPosition.value === "") {
                wrongInput(userPosition);
                return;
            }

            if (userId.value.trim() === "") {
                wrongInput(userId);
                return;
            } else for (let i = 0; i < userInfoGroup.length; i++) {
                if (userId.value.trim() === String(userInfoGroup[i].userId)) {
                    wrongInput(userId);
                    alert('중복된 아이디입니다! 다른 아이디를 이용하세요.');
                    return;
                }
            }

            if (userPosition.value === 'student' && userId.value.trim().length !== 10) {
                wrongInput(userId);
                return;
            }
            if (userPosition.value === 'prof' && userId.value.trim().length !== 9) {
                wrongInput(userId);
                return;
            }
            if (userPosition.value === 'admin' && userId.value.trim().length !== 7) {
                wrongInput(userId);
                return;
            }

            if (userPwd.value.trim() === "") {
                wrongInput(userPwd);
                return;
            }

            if (userPwdConfirm.value.trim() === "") {
                wrongInput(userPwdConfirm);
                return;
            }

            if (userName.value.trim() === "") {
                wrongInput(userName);
                return;
            }

            if (userMajorId.value === "") {
                wrongInput(userMajorId);
                return;
            }

            if (userGrade.value === "") {
                wrongInput(userGrade);
                return;
            }

            if (genderChecked === false) {
                wrongInput(userGenderList[0]);
                return;
            }

            if (userPwdConfirm.value != userPwd.value) {
                wrongInput(userPwdConfirm);
                return;
            }

            if (userPosition.value == 'admin' && userMajorId.value != 999) {
                wrongInput(userMajorId);
                return;
            }

            if (userPosition.value == 'admin' && userGrade.value != 0) {
                wrongInput(userGrade);
                return;
            }

            if (userPosition.value != 'admin' && userMajorId.value == 999) {
                wrongInput(userMajorId);
                return;
            }

            if (userPosition.value == 'prof' && userGrade.value != 9) {
                wrongInput(userGrade);
                return;
            }

            idRegModal.style.display = "none";
            regcompleteModal.style.display = "flex";
            const newUser = {
                userId: userId.value,
                userPwd: userPwd.value,
                userPosition: userPosition.value,
                userName: userName.value,
                userMajorId: userMajorId.value,
                userMajor: majorMap[userMajorId.value],
                userGrade: userGrade.value,
                userLessonList: []
            };


            userInfoGroup.push(newUser);

            localStorage.setItem('userInfoGroup', JSON.stringify(userInfoGroup));
            idRegRealForm.reset();


        });



        // completeBtn.addEventListener("click", function () {
        //     completeModal.style.display = "none";
        // });


    </script>
