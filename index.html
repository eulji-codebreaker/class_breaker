<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 로그인 화면 박스 */
        main {
            box-sizing: border-box;

            position: absolute;
            width: 1200px;
            height: 800px;

            background: #FFFFFF;
            border: 1px solid #ABABAB;
            border-radius: 10px;

            display: flex;
        }

        p {}
    </style>
</head>

<body>
    <main>
        <div>
            <div class="logBox">
                <p>로그인</p>
            </div>
        </div>
    </main>
    <script>
        fetch("/layout/header.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("/layout/footer.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })
    </script>
</body>

</html>
