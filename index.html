<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 로그인 화면 박스 */
        main {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
        }

        article {}

        label {
            font-size: 30px;
            text-align: right;
            width: 100px;
        }

        .logBox p {
            font-size: 50px;
            margin-bottom: 30px;
        }

        .logBox {
            box-sizing: border-box;
            width: 1200px;
            height: 800px;
            background: #FFFFFF;
            border: 1px solid #ABABAB;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logBox form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .formInput {
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 30px;
        }

        .formInput input {
            width: 500px;
            height: 50px;
            padding: 10px 15px;
            font-size: 24px;

            border-radius: 10px;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .loginbtn {
            box-sizing: border-box;
            display: flex;
            gap: 30px;
            margin-top: 50px;
            width: 800px;
            height: 70px;
            border-radius: 10px;

            justify-content: center;
            align-items: center;
            font-size: 36px;

            cursor: pointer;
        }

        .loginUserBtn {
            display: flex;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <main>
        <div class="modal" id="loginModal"> <!--모달의 여부가 클래스, 모달 내 내용은 아이디-->
            <article>
                <div class="logBox">
                    <form action="#" class="logForm">
                        <p><b>로그인</b></p>
                        <div class="formInput">
                            <div class="input-row">
                                <label>ID: </label>
                                <input type="text" name="userId" placeholder="학번/사번을 입력하세요">
                            </div>

                            <div class="input-row">
                                <label>PWD: </label>
                                <input type="password" name="userPwd" placeholder="비밀번호를 입력하세요">
                            </div>
                        </div>
                        
                        <button type="submit" class="loginbtn">로그인</button>
                        <p class="loginUserBtn">회원가입</p>
                    </form>
                </div>
            </article>
        </div>
        <script>
            fetch("../layout/nosideheader.html") //웹문서 요청
                .then((response) => response.text()) //응답을 받고 text로 변환
                .then((responseText) => {
                    // console.log(responseText);
                    document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
                })
            fetch("../layout/footer.html") //웹문서 요청
                .then((response) => response.text()) //응답을 받고 text로 변환
                .then((responseText) => {
                    // console.log(responseText);
                    document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
                })
        </script>
</body>

</html>
