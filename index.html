<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 로그인 화면 박스 */
        article {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logBox {
            box-sizing: border-box;

            width: 1200px;
            height: 800px;

            background: #FFFFFF;
            border: 1px solid #ABABAB;
            border-radius: 10px;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>

<body>
    <main>
        <article>
            <div class="logBox">

                <form action="#">
                    <p><b>로그인</b></p>
                    <label>ID </label>
                    <input type="text" name="userId" size="40" placeholder="학번/사번을 입력하세요"><br><br>
                    <label>PWD: </label>
                    <input type="password" name="userPwd" size="40" placeholder="비밀번호를 입력하세요">
                </form>
            </div>
        </article>
    </main>
    <script>
        fetch("../layout/header.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("../layout/footer.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })
    </script>
</body>

</html>
