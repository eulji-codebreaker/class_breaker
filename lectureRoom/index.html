<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--1601*208 308 279--> <!--gap=26!-->
    <link rel="stylesheet" href="lectureroom.css">
</head>

<body>
    <!--header-->
    <main>
        <!--<aside></aside>-->
        <article>
            <div class="lectureRoom students">
                <div id="attendance">
                    <div class="firstAttendance">
                        <p id="attendanceText">학생 출결 현황</p>
                        <div class="firstAttendanceTopRight">
                            <button class="adminbtn" id="attendanceEdit">수정</button>
                            <div id="attendanceYes"></div>
                            <p>전체 완료</p>
                            <div id="attendanceNow"></div>
                            <p>진행 중</p>
                            <div id="attendanceYet"></div>
                            <p>미완료</p>
                        </div>
                    </div>
                    <ul class="attendanceStatus"> <!--attendanceYes|attendanceNow|attendanceYet-->
                        <li id="attendanceYes"></li>
                        <li id="attendanceNow"></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                        <li></li>
                    </ul>
                </div>
                <div id="task">
                    <p>과제 제출 현황</p>
                    <div id="people"><span>24</span>
                        <p>/45</p>
                    </div>
                </div>
            </div>
            <div class="lectureRoom notice">
                <div class="high">
                    <p>공지사항</p>
                    <div>
                        <button class="adminbtn">작성</button>
                        <button class="adminbtn">수정</button>
                        <div id="triangleLeft"></div>
                        <span>1</span>
                        <p>/ 5</p>
                        <div id="triangleRight"></div>
                    </div>
                </div>
                <ul class="low">
                    <li id="firstLectureNotice">
                        <div>
                            <p>007</p>이번주 강의는 휴강입니다.<p></p>
                        </div>
                        <div>
                            <p>강민수</p>
                            <p>2026.03.08</p>
                        </div>
                    </li>
                    <li id="secondLectureNotice">
                        <div>
                            <p>006</p>강의 시간 변경 공지<p></p>
                        </div>
                        <div>
                            <p>강민수</p>
                            <p>2026.03.08</p>
                        </div>
                    </li>
                    <li id="thirdLectureNotice">
                        <div>
                            <p>005</p>자바스크립트 및 HTML 1주차 과제 안내<p></p>
                        </div>
                        <div>
                            <p>강민수</p>
                            <p>2026.03.08</p>
                        </div>
                    </li>
                    <li id="fourthLectureNotice">
                        <div>
                            <p>004</p>자바스크립트 및 HTML 1주차 강의 자료<p></p>
                        </div>
                        <div>
                            <p>강민수</p>
                            <p>2026.03.08</p>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="lectureRoom docs">
                <div class="docstop">
                    <p>수업</p>
                </div>
                <ul class="docsmain">
                    <li></li>
                    <li></li>
                    <li></li>
                    <li></li>
                </ul>
                <div class="docsbot"><button class="adminbtn">등록</button></div>
            </div>
        </article>
    </main>
    <!--footer-->
    <script>
        fetch("../layout/header.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            });
        fetch("../layout/footer.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            });

        localStorage.setItem('pageNow', 'lectureroom');
        var role = JSON.parse(localStorage.getItem('user')).userPosition;
        if (role === 'student') {
            document.querySelectorAll('.adminbtn').forEach((e) => e.style.display = 'none');
            document.querySelector('#attendanceText').innerText = '나의 출결현황';
            document.querySelectorAll('.firstAttendanceTopRight p')[0].innerText = '출석 완료';
            document.querySelectorAll('.firstAttendanceTopRight p')[1].innerText = '진행 중';
            document.querySelectorAll('.firstAttendanceTopRight p')[2].innerText = '미진행';
        }
        
        fetch("../layout/sidebar.html") //사이드바 있는경우만!!! sidebar불러오기
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('main').insertAdjacentHTML("afterbegin", responseText);
            });
            
            
            
    </script>
</body>

</html>
