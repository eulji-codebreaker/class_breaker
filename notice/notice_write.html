<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex: 1;
            width: 100%;

        }

        article {
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .noticeWrite {
            width: 1600px;
            height: 850px;

        }

        .noticeTitle {
            width: 1519px;
            height: 190px;
            border: 1px solid #ABABAB;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .noticeContent {
            width: 1519px;
            height: 525px;
            border: 1px solid #ABABAB;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        .input-content {
            width: 100%;
            height: 100%;

        }
    </style>
</head>

<body>
    <main>
        <article>
            <div class="noticeWrite">
                <form>
                    <div class="noticeTitle">
                        <textarea class="input-content" placeholder="제목을 입력하세요."></textarea>
                    </div>
                    <div class="noticeContent">
                        <textarea class="input-content" placeholder="내용을 입력하세요."></textarea>
                    </div>

                </form>
            </div>
        </article>
    </main>

    <script>
        fetch("../layout/header.html") //웹문서 요청x
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("../layout/footer.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })
        fetch("../layout/sidebar.html") //사이드바 있는경우만!!! sidebar불러오기
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('main').insertAdjacentHTML("afterbegin", responseText);
            })
    </script>
</body>

</html>
