<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>notice</title>
    <link rel="stylesheet" href="notice.css">
</head>

<body>
    <main>
        <article>
            <div class="noticeMain">
                <div class="important1">
                    <div class="noticeBox1">
                        <div class="notice-header1">
                            <div class="text">중요 공지사항</div>
                            <p class="plus">더보기 ></p>
                        </div>
                        <div class="notice1"></div>
                        <div class="notice1"></div>
                    </div>
                </div>
                <div class="general1">
                    <div class="noticeBox1">
                        <div class="notice-header1">
                            <div class="text">공지사항</div>
                            <p class="plus">더보기 ></p>
                        </div>
                        <div class="notice1"></div>
                        <div class="notice1"></div>
                        <div class="notice1"></div>
                        <div class="notice1"></div>
                        <div class="notice1"></div>
                    </div>
                </div>
            </div>
            <div class="importantNoticeList">
                <div class="important2">
                    <div class="noticeBox2">
                        <div class="notice-header2">
                            <div class="text">중요 공지사항</div>
                        </div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                        <div class="notice2"></div>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <script>
        fetch("../layout/header.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("../layout/footer.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })
        fetch("../layout/sidebar.html") //사이드바 있는경우만!!! sidebar불러오기
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('main').insertAdjacentHTML("afterbegin", responseText);
            })
    </script>
</body>

</html>
