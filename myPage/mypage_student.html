    <script>
        // 요일 변환
        function getDayClass(n) {
            return { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thr', 5: 'fri' }[n] || '';
        }

        window.renderStudentUI = () => {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;

            // 더미 데이터
            let myLessons = [];
            myLessons = JSON.parse(localStorage.getItem('myLessons'));

            // 시간표 업데이트
            document.querySelectorAll('.studentTimetable1 .timetableCol div:not(.fixedTime)').forEach(el => {
                el.innerText = '';
                el.style.backgroundColor = '';
            });

            myLessons.forEach(l => {
                const dayClass = getDayClass(Number(l.lessonDay));
                if (!dayClass) return;

                const startHour = l.lessonBegin;
                const endHour = l.lessonEnd;
                const startIdx = startHour - 8;
                const endIdx = endHour - 8;

                for (let i = startIdx; i <= endIdx; i++) {
                    const cell = document.querySelector(`.studentTimetable1 .${dayClass}.time${i}`);
                    if (cell) {
                        cell.innerText = l.lessonName;
                        cell.style.backgroundColor = '#F8F3FD';
                        cell.style.display = 'flex';
                        cell.style.alignItems = 'center';
                        cell.style.justifyContent = 'center';
                        cell.style.fontWeight = 'bold';
                        cell.style.fontSize = '12px';
                    }
                }
            });

            // 테이블 목록 업데이트
            const tbody = document.querySelector('.studentTimetable2 tbody');
            if (tbody) {
                tbody.innerHTML = myLessons.map(l => `
            <tr>
                <td>${l.lessonId.includes('m') ? '전필' : (l.lessonId.includes('s') ? '전선' : '교양')}</td>
                <td>${l.lessonName}</td>
                <td>Y</td>
                <td>신청완료</td>
            </tr>
        `).join('');
            }

            // 사이드바 목록 업데이트
            const sidebarCourseList = document.querySelector('.course-list');
            if (sidebarCourseList) {
                sidebarCourseList.innerHTML = myLessons.map(l => `
            <button type="button" class="course-card" onclick="goToLecture()">
                <p class="course-name">${l.lessonName}</p>
                <p class="professor">${l.lessonProf} 교수님</p>
            </button>
        `).join('');
            }
        };

        window.onload = () => {
            const tabTimetable = document.querySelector('.myTimetable');
            const tabLearningList = document.querySelector('.learningList');
            const table1 = document.querySelector('.studentTimetable1');
            const table2 = document.querySelector('.studentTimetable2');


            // 탭 전환
            tabTimetable.addEventListener('click', () => {
                tabTimetable.classList.add('active');
                tabLearningList.classList.remove('active');
                table1.style.display = 'grid';
                table2.style.display = 'none';
                btnContainer.style.display = 'none';
            });

            tabLearningList.addEventListener('click', () => {
                tabLearningList.classList.add('active');
                tabTimetable.classList.remove('active');
                table1.style.display = 'none';
                table2.style.display = 'block';
                btnContainer.style.display = 'flex';
            });
        }

        // 헤더, 푸터, 사이드바 불러오기
        fetch("../layout/header.html")
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
                document.querySelector('#headerLogo').onclick = () => location.href = '/mainPage/index.html';

                const day = document.querySelector('#dday');
                function diffDay() {
                    const getDay = new Date(2026, 3, 21);
                    const today = new Date();
                    const diff = getDay - today;
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    if (day) day.innerText = `중간고사 D-${days}`;
                }
                diffDay();
                setInterval(diffDay, 1000 * 60 * 60);
            });

        fetch("../layout/footer.html")
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            });

        fetch("../layout/mypage_sidebar.html")
            .then(res => res.text())
            .then(html => {
                const main = document.querySelector('main');
                if (!document.querySelector('.sidebar-container')) {
                    main.insertAdjacentHTML("afterbegin", html);
                }

                const userLocal = localStorage.getItem('user');
                if (userLocal) {
                    const user = JSON.parse(userLocal);
                    const setVal = (id, txt) => {
                        const el = document.querySelector(id);
                        if (el) el.innerText = txt;
                    };
                    setVal('#val1', user.userName);
                    setVal('#val2', user.userId);
                    setVal('#val3', user.userMajor || '미지정');
                    setVal('#val4', user.userGrade + '학년');
                }
                renderStudentUI();
            });

        window.goToLecture = function () {
            location.href = "../lectureRoom/index.html";
        };
    </script>
