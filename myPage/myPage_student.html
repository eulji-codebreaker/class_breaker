<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .topbar {
            box-sizing: border-box;

            width: 1600px;
            height: 80px;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid #8B5FBF;
            background: #EAD8FA;
            border-radius: 10px;
        }

        .topbar>div {
            font-weight: 700;
            font-size: 36px;
            line-height: 80px;
            text-align: center;
            color: #000000;
            padding: 0;
            margin: 0;
        }

        .active {
            box-sizing: border-box;

            width: 400px;
            height: 80px;

            background: #FFFFFF;
            border-radius: 10px;
        }

        .studentTimeTable1 {
            width: 1600px;
            height: 760px;
            margin-top: 20px;
            overflow: auto;
        }

        .studentTimeTable1 table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;

        }

        .studentTimeTable1 th,
        .studentTimeTable1 td {
            width: auto;
            border: 1px solid #000000;
            height: 70px;
            text-align: center;
        }

        .studenTimeTable2 {
            width: 1600px;
            height: 750px;
            margin-top: 20px;
            overflow: auto;
        }

        .studenTimeTable2 table {
            width: 100%;
            border-collapse: collapse;

        }

        .studenTimeTable2 th,
        .studenTimeTable2 td {
            width: auto;
            border: 1px solid #000000;
            height: 70px;
            text-align: center;
        }

        .studenTimeTable2 td:first-of-type {
            width: 200px;
        }

        .studenTimeTable2 td:nth-of-type(3) {
            width: 300px;
        }

        .studenTimeTable2 td:nth-of-type(4) {
            width: 300px;
        }
    </style>
</head>

    <script>
        fetch("../layout/header.html") //웹문서 요청
            .then((response) => response.text()) //응답을 받고 text로 변환
            .then((responseText) => {
                // console.log(responseText);
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
