<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mypage_professor</title>
    <link rel="stylesheet" href="mypage_professor.css">
</head>

<body>
    <main>
        <article>
            <!-- top bar -->
            <div class="topbar">
                <div class="myTimetable active">나의 시간표</div>
                <div class="learningList">당학기 개설과목 관리</div>
                <div class="empty-slot"></div>
                <div class="empty-slot">
                    <button class="adminbtn" id="btn-add">추가</button>
                    <button class="adminbtn" id="btn-edit">수정</button>
                    <button class="adminbtn" id="btn-delete">삭제</button>
                </div>
            </div>
            <!-- professor timetable 1 -->
            <div class="professorTimetable1">
                <div class="timetableCol nothing">
                    <div class="fixedTime">요일,교시</div>
                    <div class="fixedTime">08:00~08:50</div>
                    <div class="fixedTime">09:00~09:50</div>
                    <div class="fixedTime">10:00~10:50</div>
                    <div class="fixedTime">11:00~11:50</div>
                    <div class="fixedTime">12:00~12:50</div>
                    <div class="fixedTime">13:00~13:50</div>
                    <div class="fixedTime">14:00~14:50</div>
                    <div class="fixedTime">15:00~15:50</div>
                    <div class="fixedTime">16:00~16:50</div>
                    <div class="fixedTime">17:00~17:50</div>
                    <div class="fixedTime lastTime">18:00~18:50</div>
                </div>
                <div class="timetableCol mon">
                    <div class="fixedTime">월요일</div>
                    <div class="mon time0"></div>
                    <div class="mon time1"></div>
                    <div class="mon time2"></div>
                    <div class="mon time3"></div>
                    <div class="mon time4"></div>
                    <div class="mon time5"></div>
                    <div class="mon time6"></div>
                    <div class="mon time7"></div>
                    <div class="mon time8"></div>
                    <div class="mon time9"></div>
                    <div class="mon time10"></div>
                </div>
                <div class="timetableCol tue">
                    <div class="fixedTime">화요일</div>
                    <div class="tue time0"></div>
                    <div class="tue time1"></div>
                    <div class="tue time2"></div>
                    <div class="tue time3"></div>
                    <div class="tue time4"></div>
                    <div class="tue time5"></div>
                    <div class="tue time6"></div>
                    <div class="tue time7"></div>
                    <div class="tue time8"></div>
                    <div class="tue time9"></div>
                    <div class="tue time10"></div>
                </div>
                <div class="timetableCol wed">
                    <div class="fixedTime">수요일</div>
                    <div class="wed time0"></div>
                    <div class="wed time1"></div>
                    <div class="wed time2"></div>
                    <div class="wed time3"></div>
                    <div class="wed time4"></div>
                    <div class="wed time5"></div>
                    <div class="wed time6"></div>
                    <div class="wed time7"></div>
                    <div class="wed time8"></div>
                    <div class="wed time9"></div>
                    <div class="wed time10"></div>
                </div>
                <div class="timetableCol thr">
                    <div class="fixedTime">목요일</div>
                    <div class="thr time0"></div>
                    <div class="thr time1"></div>
                    <div class="thr time2"></div>
                    <div class="thr time3"></div>
                    <div class="thr time4"></div>
                    <div class="thr time5"></div>
                    <div class="thr time6"></div>
                    <div class="thr time7"></div>
                    <div class="thr time8"></div>
                    <div class="thr time9"></div>
                    <div class="thr time10"></div>
                </div>
                <div class="timetableCol fri">
                    <div class="fixedTime">금요일</div>
                    <div class="fri time0"></div>
                    <div class="fri time1"></div>
                    <div class="fri time2"></div>
                    <div class="fri time3"></div>
                    <div class="fri time4"></div>
                    <div class="fri time5"></div>
                    <div class="fri time6"></div>
                    <div class="fri time7"></div>
                    <div class="fri time8"></div>
                    <div class="fri time9"></div>
                    <div class="fri time10"></div>
                </div>
            </div>

            <!-- professor timetable 2 -->
            <div class="professorTimetable2">
                <table>
                    <thead>
                        <td>□</td>
                        <td>구분</td>
                        <td>과목명</td>
                        <td>강의시간</td>
                        <td>현재/최대</td>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </article>
    </main>

    <!-- modeal -->
    <div class="modal" id="professor-modal">
        <div class="modalContent">
            <form id="add-form" class="modal-layout">
                <h1 class="modal-title">강의 개설 신청</h1>
                <div class="info-grid">
                    <div class="info-item full-width">
                        <div class="label">과목 ID 생성</div>
                        <div class="id-combo">
                            <select id="id-major" required>
                                <option value="" disabled selected hidden>학과 선택</option>
                                <option value="162">162(의료it학과)</option>
                                <option value="158">158(빅데이터의료융합학과)</option>
                                <option value="160">160(첨단학부)</option>
                                <option value="123">123(간호학과)</option>
                                <option value="119">119(응급구조학과)</option>
                                <option value="238">238(임상병리학과)</option>
                                <option value="130">130(방사선학과)</option>
                                <option value="234">234(물리치료학과)</option>
                                <option value="228">228(치위생학과)</option>
                                <option value="888">888(안경광학과)</option>
                                <option value="999">999(관리자)</option>
                            </select>
                            <select id="id-req">
                                <option value="m">m (전공필수)</option>
                                <option value="s">s (전공선택)</option>
                            </select>
                            <input type="number" id="id-num" placeholder="00" min="0" max="99" required>
                            <span class="helper-text">* 학과번호</span>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="label">과목명</div>
                        <input type="text" id="lessonName" required>
                    </div>

                    <div class="info-item">
                        <div class="label">대상학년</div>
                        <select id="lessonGrade">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                            <option value="4">4학년</option>
                            <option value="0">교양(0)</option>
                        </select>
                    </div>

                    <div class="info-item">
                        <div class="label">최대인원</div>
                        <input type="number" id="lessonMax" min="1" required value="40">
                    </div>

                    <div class="info-item">
                        <div class="label">강의실</div>
                        <input type="text" id="lessonRoom" required placeholder="예: 본관 301호">
                    </div>

                    <div class="info-item">
                        <div class="label">요일</div>
                        <select id="lessonDay">
                            <option value="1">월요일</option>
                            <option value="2">화요일</option>
                            <option value="3">수요일</option>
                            <option value="4">목요일</option>
                            <option value="5">금요일</option>
                        </select>
                    </div>

                    <div class="info-item">
                        <div class="label">시작시간</div>
                        <select id="lessonBegin">
                        </select>
                    </div>

                    <div class="info-item">
                        <div class="label">종료시간</div>
                        <select id="lessonEnd">
                        </select>
                    </div>

                    <div class="info-item">
                        <div class="label">학점</div>
                        <input type="number" id="lessonPoint" min="1" max="5" value="3">
                    </div>
                </div>

                <div class="info-item textarea-item">
                    <div class="label">강의설명</div>
                    <textarea id="lessonContent" placeholder="강의 상세 내용을 입력하세요."></textarea>
                </div>

                <div class="modal-btn-group">
                    <button type="submit" class="modalbtn primary">저장하기</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </form>

            <div id="delete-confirm" class="modal-layout">
                <h2 class="modal-title">정말 삭제하시겠습니까?</h2>
                <p id="delete-target-info"></p>

                <div class="modal-btn-group">
                    <button type="button" id="execute-delete-btn" class="modalbtn danger">삭제확인</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabTimetable = document.querySelector('.myTimetable');
        const tabLearningList = document.querySelector('.learningList');
        const table1 = document.querySelector('.professorTimetable1');
        const table2 = document.querySelector('.professorTimetable2');
        const btnContainer = document.querySelector('.topbar .empty-slot:last-child');
        const modal = document.getElementById('professor-modal');
        const addForm = document.getElementById('add-form');

        let isEditMode = false;
        let editTargetId = null;

        window.renderLessonTable = () => {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;

            const lessons = userData.userLessonList || [];

            // table1 업데이트
            document.querySelectorAll('.timetableCol div:not(.fixedTime)').forEach(el => {
                el.innerText = '';
                el.style.backgroundColor = '';
            });

            lessons.forEach(l => {
                const dayClass = getDayClass(Number(l.lessonDay));
                if (!dayClass) return;
                const startIdx = Number(l.lessonBegin) - 8;
                const endIdx = Number(l.lessonEnd) - 8;

                for (let i = startIdx; i <= endIdx; i++) {
                    const cell = document.querySelector(`.${dayClass}.time${i}`);
                    if (cell) {
                        cell.innerText = l.lessonName;
                        cell.style.backgroundColor = '#ead8fa';
                        cell.style.fontSize = '14px';
                        cell.style.display = 'flex';
                        cell.style.alignItems = 'center';
                        cell.style.justifyContent = 'center';
                        cell.style.fontWeight = 'bold';
                    }
                }
            });

            // table2 업데이트
            const tbody = document.querySelector('.professorTimetable2 tbody');
            if (tbody) {
                tbody.innerHTML = lessons.map(l => `
                    <tr data-id="${l.lessonId}">
                        <td><input type="checkbox" class="row-check"></td>
                        <td>${l.lessonId.includes('m') ? '전필' : '전선'}</td>
                        <td>${l.lessonName}</td>
                        <td>${getKDay(l.lessonDay)} ${l.lessonBegin}:00~${l.lessonEnd}:50</td>
                        <td>${l.lessonNow}/${l.lessonMax}</td>
                    </tr>
                `).join('');
            }

            // sidebar 업데이트
            const sidebarCourseList = document.querySelector('.course-list');
            if (sidebarCourseList) {
                sidebarCourseList.innerHTML = lessons.map(l => `
                    <button type="button" class="course-card" onclick="goToLecture()">
                        <p class="course-name">${l.lessonName}</p>
                        <p class="professor">${l.lessonProf} 교수님</p>
                    </button>
                `).join('');
            }
        };

        function getKDay(n) { return ['일', '월', '화', '수', '목', '금', '토'][n] || ''; }
        function getDayClass(n) {
            const classes = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thr', 5: 'fri' };
            return classes[n] || '';
        }
        const renderTimeOptions = () => {
            const beginSel = document.getElementById('lessonBegin');
            const endSel = document.getElementById('lessonEnd');
            let bOptions = '', eOptions = '';
            for (let i = 8; i <= 18; i++) {
                bOptions += `<option value="${i}">${i}:00</option>`;
                eOptions += `<option value="${i}">${i}:50</option>`;
            }
            if (beginSel) beginSel.innerHTML = bOptions;
            if (endSel) endSel.innerHTML = eOptions;
        };


        /* top bar */
        tabTimetable.addEventListener('click', () => {
            tabTimetable.classList.add('active');
            tabLearningList.classList.remove('active');
            table1.style.display = 'grid';
            table2.style.display = 'none';
            btnContainer.style.display = 'none';
            renderLessonTable();
        });

        tabLearningList.addEventListener('click', () => {
            tabLearningList.classList.add('active');
            tabTimetable.classList.remove('active');
            table1.style.display = 'none';
            table2.style.display = 'block';
            btnContainer.style.display = 'flex';
            renderLessonTable();
        });


        /* modal */
        window.closeModal = () => {
            modal.style.display = 'none';
            addForm.reset();
        };

        const openLayout = (layoutId) => {
            modal.style.display = 'flex';
            document.querySelectorAll('.modal-layout').forEach(l => l.style.display = 'none');
            document.getElementById(layoutId).style.display = 'flex';
        };

        document.getElementById('btn-add').addEventListener('click', () => {
            isEditMode = false;
            editTargetId = null;
            openLayout('add-form');
            document.querySelector('.modal-title').innerText = "강의 개설 신청";
        });

        document.getElementById('btn-edit').addEventListener('click', () => {
            const checked = document.querySelector('.row-check:checked');
            if (!checked) return alert("수정할 과목을 선택해주세요.");

            const lessonId = checked.closest('tr').dataset.id;
            const allLessons = JSON.parse(localStorage.getItem('openedLessons')) || [];
            const target = allLessons.find(l => l.lessonId === lessonId);

            if (target) {
                isEditMode = true;
                editTargetId = lessonId;
                openLayout('add-form');
                document.querySelector('.modal-title').innerText = "강의 정보 수정";

                document.getElementById('id-major').value = target.lessonId.substring(0, 3);
                document.getElementById('id-req').value = target.lessonId.substring(3, 4);
                document.getElementById('id-num').value = target.lessonId.substring(4, 6);
                document.getElementById('lessonName').value = target.lessonName;
                document.getElementById('lessonGrade').value = target.lessonGrade;
                document.getElementById('lessonMax').value = target.lessonMax;
                document.getElementById('lessonRoom').value = target.lessonRoom;
                document.getElementById('lessonDay').value = target.lessonDay;
                document.getElementById('lessonBegin').value = target.lessonBegin;
                document.getElementById('lessonEnd').value = target.lessonEnd;
                document.getElementById('lessonPoint').value = target.lessonPoint || 3;
                document.getElementById('lessonContent').value = target.lessonContent || "";
            }
        });

        document.getElementById('btn-delete').addEventListener('click', () => {
            const checked = document.querySelector('.row-check:checked');
            if (!checked) return alert("삭제할 과목을 선택해주세요.");
            editTargetId = checked.closest('tr').dataset.id;
            const lessonName = checked.closest('tr').children[2].innerText;
            openLayout('delete-confirm');
            document.getElementById('delete-target-info').innerText = `과목: ${lessonName} (${editTargetId})`;
        });

        document.getElementById('execute-delete-btn').addEventListener('click', () => {
            let all = JSON.parse(localStorage.getItem('openedLessons')) || [];
            localStorage.setItem('openedLessons', JSON.stringify(all.filter(l => l.lessonId !== editTargetId)));
            const user = JSON.parse(localStorage.getItem('user'));
            user.userLessonList = (user.userLessonList || []).filter(l => l.lessonId !== editTargetId);
            localStorage.setItem('user', JSON.stringify(user));
            closeModal();
            renderLessonTable();
        });

        addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('user'));
            const major = document.getElementById('id-major').value;
            const req = document.getElementById('id-req').value;
            const num = document.getElementById('id-num').value.padStart(2, '0');
            const fullId = `${major}${req}${num}`;

            const newLesson = {
                lessonId: fullId,
                lessonName: document.getElementById('lessonName').value,
                lessonProfId: Number(user.userId),
                lessonProf: user.userName,
                lessonMajorId: Number(major),
                lessonGrade: Number(document.getElementById('lessonGrade').value),
                lessonNow: isEditMode ? (JSON.parse(localStorage.getItem('openedLessons')).find(l => l.lessonId === editTargetId).lessonNow) : 0,
                lessonMax: Number(document.getElementById('lessonMax').value),
                lessonRoom: document.getElementById('lessonRoom').value,
                lessonDay: Number(document.getElementById('lessonDay').value),
                lessonBegin: Number(document.getElementById('lessonBegin').value),
                lessonEnd: Number(document.getElementById('lessonEnd').value),
                lessonPoint: Number(document.getElementById('lessonPoint').value),
                lessonContent: document.getElementById('lessonContent').value
            };

            let all = JSON.parse(localStorage.getItem('openedLessons')) || [];
            if (isEditMode) {
                const idx = all.findIndex(l => l.lessonId === editTargetId);
                all[idx] = newLesson;
                const uIdx = user.userLessonList.findIndex(l => l.lessonId === editTargetId);
                user.userLessonList[uIdx] = newLesson;
            } else {
                if (!user.userLessonList) user.userLessonList = [];
                user.userLessonList.push(newLesson);
                all.push(newLesson);
            }
            localStorage.setItem('openedLessons', JSON.stringify(all));
            localStorage.setItem('user', JSON.stringify(user));
            alert("완료되었습니다.");
            closeModal();
            renderLessonTable();
        });



        /* sidebar */
        renderTimeOptions();

        fetch("../layout/mypage_sidebar.html")
            .then(res => res.text())
            .then(html => {
                const main = document.querySelector('main');
                if (!document.querySelector('.sidebar-container')) {
                    main.insertAdjacentHTML("afterbegin", html);
                }
                renderLessonTable();

                const user = JSON.parse(localStorage.getItem('user'));
                if (user) {
                    const nameEl = document.getElementById('info-name');
                    const idEl = document.getElementById('info-id');
                    if (nameEl) nameEl.innerText = `이름: ${user.userName} 교수님`;
                    if (idEl) idEl.innerText = `사번: ${user.userId}`;
                }
            });


        /* header, footer */
        fetch("../layout/header.html")
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("afterbegin", responseText);
            })
        fetch("../layout/footer.html")
            .then((response) => response.text())
            .then((responseText) => {
                document.querySelector('body').insertAdjacentHTML("beforeend", responseText);
            })

        window.goToLecture = function () {
            const targetPath = "../lectureRoom/index.html";
            location.href = targetPath;
        };
    </script>
</body>

</html>
