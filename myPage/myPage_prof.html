<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>professor</title>
    <link rel="stylesheet" href="mypage_professor.css">
</head>

<body>
    <main>
        <article>
            <!-- top bar -->
            <div class="topbar">
                <div class="myTimetable active">나의 시간표</div>
                <div class="learningList">당학기 개설과목 관리</div>
                <div class="empty-slot"></div>
                <div class="empty-slot">
                    <button class="adminbtn" id="btn-add">추가</button>
                    <button class="adminbtn" id="btn-edit">수정</button>
                    <button class="adminbtn" id="btn-delete">삭제</button>
                </div>
            </div>
            <!-- professor timetable 1 -->
            <div class="professorTimetable1">
                <div class="timetableCol nothing">
                    <div class="fixedTime">요일,교시</div>

                    <div class="fixedTime">14:00~14:50</div>
                    <div class="fixedTime">15:00~15:50</div>
                    <div class="fixedTime">16:00~16:50</div>
                    <div class="fixedTime">17:00~17:50</div>

                <div class="timetableCol mon">
                    <div class="fixedTime">월요일</div>
                    <div class="mon time0"></div>
                    <div class="mon time1"></div>

                    <div class="mon time4"></div>
                    <div class="mon time5"></div>

                <div class="timetableCol tue">
                    <div class="fixedTime">화요일</div>
                    <div class="tue time0"></div>
                    <div class="tue time1"></div>
                    <div class="tue time2"></div>
                    <div class="tue time3"></div>
                    <div class="tue time4"></div>
                    <div class="tue time5"></div>
                    <div class="tue time6"></div>
                    <div class="tue time7"></div>
                    <div class="tue time8"></div>
                    <div class="tue time9"></div>
                    <div class="tue time10"></div>
                </div>
                <div class="timetableCol wed">
                    <div class="fixedTime">수요일</div>
                    <div class="wed time0"></div>
                    <div class="wed time1"></div>
                    <div class="wed time2"></div>
                    <div class="wed time3"></div>
                    <div class="wed time4"></div>
                    <div class="wed time5"></div>
                    <div class="wed time6"></div>
                    <div class="wed time7"></div>
                    <div class="wed time8"></div>
                    <div class="wed time9"></div>
                    <div class="wed time10"></div>
                </div>
                <div class="timetableCol thr">
                    <div class="fixedTime">목요일</div>
                    <div class="thr time0"></div>
                    <div class="thr time1"></div>
                    <div class="thr time2"></div>
                    <div class="thr time3"></div>
                    <div class="thr time4"></div>
                    <div class="thr time5"></div>
                    <div class="thr time6"></div>
                    <div class="thr time7"></div>
                    <div class="thr time8"></div>
                    <div class="thr time9"></div>
                    <div class="thr time10"></div>
                </div>
                <div class="timetableCol fri">
                    <div class="fixedTime">금요일</div>
                    <div class="fri time0"></div>
                    <div class="fri time1"></div>
                    <div class="fri time2"></div>
                    <div class="fri time3"></div>
                    <div class="fri time4"></div>
                    <div class="fri time5"></div>
                    <div class="fri time6"></div>
                    <div class="fri time7"></div>
                    <div class="fri time8"></div>
                    <div class="fri time9"></div>
                    <div class="fri time10"></div>
                </div>
            </div>

            <!-- professor timetable 2 -->
            <div class="professorTimetable2">
                <table>
                    <thead>
                        <td>□</td>
                        <td>구분</td>
                        <td>과목명</td>
                        <td>강의시간</td>
                        <td>현재/최대</td>
                    </thead>
                    <tbody>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td><input type="checkbox" class="row-check"></td>
                            <td></td>
                            <td></td>
                            <td></td>
                            <td></td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </article>
    </main>

    <!-- modeal -->
    <div class="modal" id="professor-modal">
        <div class="modalContent">
            <form id="add-form" class="modal-layout">
                <h1 class="modal-title">강의 개설 신청</h1>
                <div class="info-grid">
                    <div class="info-item full-width">
                        <div class="label">과목 ID 생성</div>
                        <div class="id-combo">
                            <select id="id-major" required
                                onchange="document.getElementById('id-num').value = this.value">
                                <option value="" disabled selected hidden>학과를 선택해주세요.</option>
                                <option value="162">의료it학과</option>
                                <option value="158">빅데이터의료융합학과</option>
                                <option value="160">첨단학부</option>
                                <option value="123">간호학과</option>
                                <option value="119">응급구조학과</option>
                                <option value="238">임상병리학과</option>
                                <option value="130">방사선학과</option>
                                <option value="234">물리치료학과</option>
                                <option value="228">치위생학과</option>
                                <option value="888">안경광학과</option>
                                <option value="999">관리자</option>
                            </select>
                            <select id="id-req">
                                <option value="m">m (전공필수)</option>
                                <option value="s">s (전공선택)</option>
                            </select>
                            <input type="number" id="id-num" placeholder="000" readonly>
                            <span class="helper-text">* 자동입력</span>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="label">과목명</div>
                        <input type="text" id="lessonName" required>
                    </div>
                    <div class="info-item">
                        <div class="label">대상학년</div>
                        <select id="lessonGrade">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                            <option value="4">4학년</option>
                            <option value="0">교양(0)</option>
                        </select>
                    </div>
                    <div class="info-item">
                        <div class="label">최대인원</div>
                        <input type="number" id="lessonMax" min="1" required value="40">
                    </div>
                    <div class="info-item">
                        <div class="label">강의실</div>
                        <input type="text" id="lessonRoom" required placeholder="예: 본관 301호">
                    </div>
                    <div class="info-item">
                        <div class="label">요일</div>
                        <select id="lessonDay">
                            <option value="1">월요일</option>
                            <option value="2">화요일</option>
                            <option value="3">수요일</option>
                            <option value="4">목요일</option>
                            <option value="5">금요일</option>
                        </select>
                    </div>
                    <div class="info-item">
                        <div class="label">시작시간</div>
                        <select id="lessonBegin"></select>
                    </div>
                    <div class="info-item">
                        <div class="label">종료시간</div>
                        <select id="lessonEnd"></select>
                    </div>
                    <div class="info-item">
                        <div class="label">학점</div>
                        <input type="number" id="lessonPoint" min="1" max="5" value="3">
                    </div>
                </div>

                <div class="syllabus-container">
                    <div class="label">강의계획서 (1~15주차)</div>
                    <div class="week-grid" id="syllabus-weeks">
                    </div>
                </div>

                <div class="modal-btn-group">
                    <button type="submit" class="modalbtn primary">저장하기</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </form>

            <div id="delete-confirm" class="modal-layout">
                <h2 class="modal-title">정말 삭제하시겠습니까?</h2>
                <p id="delete-target-info"></p>

                <div class="modal-btn-group">
                    <button type="button" id="execute-delete-btn" class="modalbtn danger">삭제</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </div>

            <div id="alert-layout" class="modal-layout">
                <h2 class="modal-title" id="alert-title">알림</h2>
                <p id="alert-message" style="margin-bottom: 20px; text-align: center;"></p>
                <div class="modal-btn-group">
                    <button type="button" class="modalbtn primary" onclick="closeModal()">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const tabTimetable = document.querySelector('.myTimetable');
        const tabLearningList = document.querySelector('.learningList');
        const table1 = document.querySelector('.professorTimetable1');
        const table2 = document.querySelector('.professorTimetable2');
        const btnContainer = document.querySelector('.topbar .empty-slot:last-child');
        const modal = document.getElementById('professor-modal');
        const addForm = document.getElementById('add-form');

        let isEditMode = false;
        let editTargetId = null;

        /* 15주차 강의계획서 입력 필드 생성 */
        const renderSyllabusFields = () => {
            const container = document.getElementById('syllabus-weeks');
            if (!container) return;
            let html = '';
            for (let i = 1; i <= 15; i++) {
                html += `
            <div class="week-item">
                <span>${i}주차</span>
                <input type="text" class="syllabus-input" data-week="${i}" placeholder="내용 입력">
            </div>
        `;
            }
            container.innerHTML = html;
        };

        /* 시간 선택 옵션 생성 */
        const renderTimeOptions = () => {
            const beginSel = document.getElementById('lessonBegin');
            const endSel = document.getElementById('lessonEnd');
            let bOptions = '', eOptions = '';
            for (let i = 8; i <= 18; i++) {
                bOptions += `<option value="${i}">${i}:00</option>`;
                eOptions += `<option value="${i}">${i}:50</option>`;
            }
            if (beginSel) beginSel.innerHTML = bOptions;
            if (endSel) endSel.innerHTML = eOptions;
        };

        /* 테이블 렌더링 (메인 시간표 + 메인 목록 + 사이드바 목록) */
        window.renderLessonTable = () => {
            const userData = JSON.parse(localStorage.getItem('user'));
            if (!userData) return;

            const lessons = userData.userLessonList || [];

            // 시간표(Table 1) 업데이트
            document.querySelectorAll('.timetableCol div:not(.fixedTime)').forEach(el => {
                el.innerText = ''; el.style.backgroundColor = '';
            });

            lessons.forEach(l => {
                const dayClass = getDayClass(Number(l.lessonDay));
                if (!dayClass) return;
                const startIdx = Number(l.lessonBegin) - 8;
                const endIdx = Number(l.lessonEnd) - 8;

                for (let i = startIdx; i <= endIdx; i++) {
                    const cell = document.querySelector(`.${dayClass}.time${i}`);
                    if (cell) {
                        cell.innerText = l.lessonName;
                        cell.style.backgroundColor = '#F8F3FD';
                        cell.style.fontSize = '12px';
                        cell.style.display = 'flex';
                        cell.style.alignItems = 'center';
                        cell.style.justifyContent = 'center';
                        cell.style.fontWeight = 'bold';
                    }
                }
            });

            // 메인 목록(Table 2) 업데이트
            const tbody = document.querySelector('.professorTimetable2 tbody');
            if (tbody) {
                tbody.innerHTML = lessons.map(l => `
            <tr data-id="${l.lessonId}">
                <td><input type="checkbox" class="row-check"></td>
                <td>${l.lessonId.includes('m') ? '전필' : '전선'}</td>
                <td>${l.lessonName}</td>
                <td>${getKDay(l.lessonDay)} ${l.lessonBegin}:00~${l.lessonEnd}:50</td>
                <td>${l.lessonNow || 0}/${l.lessonMax}</td>
            </tr>
        `).join('');
            }

            // 사이드바 강의 목록 업데이트
            const sidebarCourseList = document.querySelector('.course-list');
            if (sidebarCourseList) {
                sidebarCourseList.innerHTML = lessons.map(l => `
            <button type="button" class="course-card" onclick="goToLecture()">
                <p class="course-name">${l.lessonName}</p>
                <p class="professor">${l.lessonProf} 교수님</p>
            </button>
        `).join('');
            }
        };

        const getKDay = (n) => ['일', '월', '화', '수', '목', '금', '토'][n] || '';
        const getDayClass = (n) => ({ 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thr', 5: 'fri' }[n] || '');

        /* 모달창 */
        window.closeModal = () => {
            modal.style.display = 'none';
            addForm.reset();
            document.querySelectorAll('.syllabus-input').forEach(input => input.value = '');
        };

        const openLayout = (layoutId) => {
            modal.style.display = 'flex';
            document.querySelectorAll('.modal-layout').forEach(l => l.style.display = 'none');
            document.getElementById(layoutId).style.display = 'flex';
            if (layoutId === 'add-form') renderSyllabusFields();
        };

        const showAlert = (message, title = "알림") => {
            openLayout('alert-layout');
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
        };

        /* 탭 전환 이벤트 */
        tabTimetable.addEventListener('click', () => {
            tabTimetable.classList.add('active'); tabLearningList.classList.remove('active');
            table1.style.display = 'grid'; table2.style.display = 'none';
            btnContainer.style.display = 'none'; renderLessonTable();
        });

        tabLearningList.addEventListener('click', () => {
            tabLearningList.classList.add('active'); tabTimetable.classList.remove('active');
            table1.style.display = 'none'; table2.style.display = 'block';
            btnContainer.style.display = 'flex'; renderLessonTable();
        });

        /* 강의 저장 (추가 및 수정) */
        addForm.onsubmit = (e) => {
            e.preventDefault();

            const beginTime = Number(document.getElementById('lessonBegin').value);
            const endTime = Number(document.getElementById('lessonEnd').value);

            // 시간 유효성 검사
            if (beginTime >= endTime) {
                return showAlert("종료 시간은 시작 시간보다 늦어야 합니다.", "시간 설정 오류");
            }

            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) return;

            const major = document.getElementById('id-major').value;
            const req = document.getElementById('id-req').value;
            const num = document.getElementById('id-num').value;
            const fullId = isEditMode ? editTargetId : `${major}${req}${num}01`;

            const syllabusData = {};
            document.querySelectorAll('.syllabus-input').forEach(input => {
                syllabusData[input.dataset.week] = input.value;
            });

            let allOpened = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            const prevData = allOpened.find(l => String(l.lessonId) === String(editTargetId));

            const newLesson = {
                lessonId: fullId,
                lessonName: document.getElementById('lessonName').value,
                lessonProfId: Number(user.userId),
                lessonProf: user.userName,
                lessonMajorId: major,
                lessonGrade: Number(document.getElementById('lessonGrade').value),
                lessonNow: isEditMode ? (prevData?.lessonNow || 0) : 0,
                lessonMax: Number(document.getElementById('lessonMax').value),
                lessonRoom: document.getElementById('lessonRoom').value,
                lessonDay: Number(document.getElementById('lessonDay').value),
                lessonBegin: beginTime,
                lessonEnd: endTime,
                lessonPoint: Number(document.getElementById('lessonPoint').value),
                lessonSyllabus: syllabusData
            };

            if (isEditMode) {
                const idx = allOpened.findIndex(l => String(l.lessonId) === String(editTargetId));
                if (idx !== -1) allOpened[idx] = newLesson;
            } else {
                allOpened.push(newLesson);
            }
            localStorage.setItem('openedLessons', JSON.stringify(allOpened));

            if (!user.userLessonList) user.userLessonList = [];
            if (isEditMode) {
                const uIdx = user.userLessonList.findIndex(l => String(l.lessonId) === String(editTargetId));
                if (uIdx !== -1) user.userLessonList[uIdx] = newLesson;
            } else {
                user.userLessonList.push(newLesson);
            }
            localStorage.setItem('user', JSON.stringify(user));

            let allUsers = JSON.parse(localStorage.getItem('userInfoGroup') || '[]');
            const updatedUsers = allUsers.map(u => String(u.userId) === String(user.userId) ? user : u);
            localStorage.setItem('userInfoGroup', JSON.stringify(updatedUsers));

            closeModal();
            setTimeout(() => { showAlert("반영되었습니다.", "완료"); renderLessonTable(); }, 100);
        };

        /* 추가/수정/삭제 버튼 동작 */
        document.getElementById('btn-add').onclick = () => {
            isEditMode = false; editTargetId = null;
            openLayout('add-form');
            document.querySelector('.modal-title').innerText = "강의 개설 신청";
        };

        document.getElementById('btn-edit').onclick = () => {
            const checked = document.querySelector('.row-check:checked');
            if (!checked) return showAlert("수정할 과목을 선택해주세요.");

            const lessonId = checked.closest('tr').dataset.id;
            const user = JSON.parse(localStorage.getItem('user'));
            const target = user.userLessonList.find(l => String(l.lessonId) === String(lessonId));

            if (target) {
                isEditMode = true; editTargetId = lessonId;
                openLayout('add-form');
                document.querySelector('.modal-title').innerText = "강의 정보 수정";

                document.getElementById('id-major').value = String(target.lessonId).substring(0, 3);
                document.getElementById('id-num').value = String(target.lessonId).substring(0, 3);
                document.getElementById('lessonName').value = target.lessonName;
                document.getElementById('lessonGrade').value = String(target.lessonGrade);
                document.getElementById('lessonMax').value = target.lessonMax;
                document.getElementById('lessonRoom').value = target.lessonRoom || "";
                document.getElementById('lessonDay').value = String(target.lessonDay);
                document.getElementById('lessonBegin').value = String(target.lessonBegin);
                document.getElementById('lessonEnd').value = String(target.lessonEnd);
                document.getElementById('lessonPoint').value = target.lessonPoint || 3;

                if (target.lessonSyllabus) {
                    document.querySelectorAll('.syllabus-input').forEach(input => {
                        input.value = target.lessonSyllabus[input.dataset.week] || "";
                    });
                }
            }
        };

        document.getElementById('btn-delete').onclick = () => {
            const checked = document.querySelector('.row-check:checked');
            if (!checked) return showAlert("삭제할 과목을 선택해주세요.");
            editTargetId = checked.closest('tr').dataset.id;
            const lessonName = checked.closest('tr').children[2].innerText;
            openLayout('delete-confirm');
            document.getElementById('delete-target-info').innerText = `과목: ${lessonName} (${editTargetId})`;
        };

        document.getElementById('execute-delete-btn').onclick = () => {
            if (!editTargetId) return;
            let allOpened = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            allOpened = allOpened.filter(l => String(l.lessonId) !== String(editTargetId));
            localStorage.setItem('openedLessons', JSON.stringify(allOpened));

            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                user.userLessonList = (user.userLessonList || []).filter(l => String(l.lessonId) !== String(editTargetId));
                localStorage.setItem('user', JSON.stringify(user));
                let allUsers = JSON.parse(localStorage.getItem('userInfoGroup') || '[]');
                localStorage.setItem('userInfoGroup', JSON.stringify(allUsers.map(u => String(u.userId) === String(user.userId) ? user : u)));
            }
            closeModal();
            setTimeout(() => { showAlert("삭제되었습니다.", "완료"); renderLessonTable(); }, 100);
        };

        /* 헤더, 푸터, 사이드바 */
        window.onload = () => {
            renderTimeOptions();

            fetch("../layout/header.html").then(res => res.text()).then(h => document.body.insertAdjacentHTML("afterbegin", h));
            fetch("../layout/footer.html").then(res => res.text()).then(h => document.body.insertAdjacentHTML("beforeend", h));

            fetch("../layout/mypage_sidebar.html")
                .then(res => res.text())
                .then(html => {
                    const main = document.querySelector('main');
                    if (!document.querySelector('.sidebar-container')) main.insertAdjacentHTML("afterbegin", html);

                    const user = JSON.parse(localStorage.getItem('user'));
                    if (user) {
                        const namePlace = document.querySelector('.namePlace');
                        if (namePlace) namePlace.innerText = `${user.userName} 교수님`;

                        const setVal = (id, txt) => { const el = document.querySelector(id); if (el) el.innerText = txt; };
                        setVal('#val1', user.userName);
                        setVal('#val2', user.userId);
                        setVal('#val3', user.userMajor);
                        const l4 = document.querySelector('#label4');
                        if (l4 && l4.closest('li')) l4.closest('li').style.display = "none";
                    }
                    renderLessonTable();
                });
        };

        window.goToLecture = () => { location.href = "../lectureRoom/index.html"; };
    </script>
</body>

</html>
