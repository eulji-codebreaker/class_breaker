<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mypage_admin</title>
    <link rel="stylesheet" href="mypage_admin.css">
</head>

<body>
    <main>
        <article>
            <div class="openingList">
                <div class="title">
                    <div class="text">개설된 모든 과목</div>
                    <div class="option">
                        <select id="id-major" required>
                            <option value="999">전체 학과 조회</option>
                            <option value="162">의료it학과</option>
                            <option value="158">빅데이터의료융합학과</option>
                            <option value="160">첨단학부</option>
                            <option value="123">간호학과</option>
                            <option value="119">응급구조학과</option>
                            <option value="238">임상병리학과</option>
                            <option value="130">방사선학과</option>
                            <option value="234">물리치료학과</option>
                            <option value="228">치위생학과</option>
                            <option value="888">안경광학과</option>
                        </select>
                    </div>
                    <div class="button-group">
                        <button class="adminbtn" id="btn-add-main">추가</button>
                    </div>
                </div>
                <div class="content">
                    <ul class="lecture-list"></ul>
                </div>
            </div>
        </article>
    </main>

    <div class="modal" id="admin-modal">
        <div class="modalContent">
            <form id="add-form" class="modal-layout">
                <h1 class="modal-title">강의 개설 신청</h1>
                <div class="info-grid">
                    <div class="info-item full-width">
                        <div class="label">과목 ID 생성</div>
                        <div class="id-combo">
                            <select id="modal-major-select" required>
                                <option value="" disabled selected hidden>학과를 선택해주세요.</option>
                                <option value="162">의료it학과</option>
                                <option value="158">빅데이터의료융합학과</option>
                                <option value="160">첨단학부</option>
                                <option value="123">간호학과</option>
                                <option value="119">응급구조학과</option>
                                <option value="238">임상병리학과</option>
                                <option value="130">방사선학과</option>
                                <option value="234">물리치료학과</option>
                                <option value="228">치위생학과</option>
                                <option value="888">안경광학과</option>
                            </select>
                            <select id="modal-req">
                                <option value="m">m (전공필수)</option>
                                <option value="s">s (전공선택)</option>
                            </select>
                            <input type="number" id="modal-num" placeholder="00" min="0" max="99" required>
                            <span class="helper-text">* 학과번호</span>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="label">과목명</div>
                        <input type="text" id="lessonName" required>
                    </div>
                    <div class="info-item">
                        <div class="label">대상학년</div>
                        <select id="lessonGrade">
                            <option value="1">1학년</option>
                            <option value="2">2학년</option>
                            <option value="3">3학년</option>
                            <option value="4">4학년</option>
                            <option value="0">교양(0)</option>
                        </select>
                    </div>
                    <div class="info-item">
                        <div class="label">최대인원</div>
                        <input type="number" id="lessonMax" min="1" required value="40">
                    </div>
                    <div class="info-item">
                        <div class="label">강의실</div>
                        <input type="text" id="lessonRoom" required>
                    </div>
                    <div class="info-item">
                        <div class="label">요일</div>
                        <select id="lessonDay">
                            <option value="1">월요일</option>
                            <option value="2">화요일</option>
                            <option value="3">수요일</option>
                            <option value="4">목요일</option>
                            <option value="5">금요일</option>
                        </select>
                    </div>
                    <div class="info-item">
                        <div class="label">시작시간</div>
                        <select id="lessonBegin"></select>
                    </div>
                    <div class="info-item">
                        <div class="label">종료시간</div>
                        <select id="lessonEnd"></select>
                    </div>
                    <div class="info-item">
                        <div class="label">학점</div>
                        <input type="number" id="lessonPoint" min="1" max="5" value="3">
                    </div>
                </div>
                <div class="info-item textarea-item">
                    <div class="label">강의설명</div>
                    <textarea id="lessonContent" placeholder="강의 상세 내용을 입력하세요."></textarea>
                </div>
                <div class="modal-btn-group" id="admin-modal-btns">
                    <button type="submit" class="modalbtn primary">저장하기</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </form>

            <div id="delete-confirm" class="modal-layout">
                <h2 class="modal-title">정말 삭제하시겠습니까?</h2>
                <p id="delete-target-info" style="text-align: center; margin-bottom: 20px; font-weight: bold;"></p>
                <div class="modal-btn-group">
                    <button type="button" id="execute-delete-btn" class="modalbtn danger">삭제확인</button>
                    <button type="button" class="modalbtn" onclick="closeModal()">취소</button>
                </div>
            </div>
        </div>
    </div>

    <div id="result-modal" class="modal">
        <div class="modalContent result-box" style="width: 400px; text-align: center;">
            <h2 id="result-title" class="modal-title">알림</h2>
            <p id="result-message" style="margin-bottom: 25px;"></p>
            <div class="modal-btn-group">
                <button type="button" class="modalbtn primary" onclick="closeResultModal()">확인</button>
            </div>
        </div>
    </div>

    <script>
        let isEditMode = false;
        let editTargetId = null;
        const mainModal = document.getElementById('admin-modal');
        const resModal = document.getElementById('result-modal');
        const addForm = document.getElementById('add-form');

        function showResultModal(title, message) {
            document.getElementById('result-title').innerText = title;
            document.getElementById('result-message').innerText = message;
            resModal.style.display = 'flex';
        }

        window.closeResultModal = () => { resModal.style.display = 'none'; };

        const openLayout = (layoutId) => {
            mainModal.style.display = 'flex';
            document.querySelectorAll('.modal-layout').forEach(l => l.style.display = 'none');
            document.getElementById(layoutId).style.display = 'flex';
        };

        window.closeModal = () => {
            mainModal.style.display = 'none';
            addForm.reset();
        };

        function renderAdminLessonList() {
            const allLessons = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            const listContainer = document.querySelector('.lecture-list');
            const filterValue = document.getElementById('id-major').value;

            if (!listContainer) return;

            const filteredLessons = (filterValue === "999")
                ? allLessons
                : allLessons.filter(l => l.lessonId.startsWith(filterValue));

            if (filteredLessons.length === 0) {
                listContainer.innerHTML = '<li style="justify-content:center; padding:20px;">개설된 과목이 없습니다.</li>';
                return;
            }

            const majorNames = {
                "162": "의료IT", "158": "빅데이터", "160": "첨단학부",
                "123": "간호", "119": "응급구조", "238": "임상병리",
                "130": "방사선", "234": "물리치료", "228": "치위생", "888": "안경광학"
            };

            listContainer.innerHTML = filteredLessons.map(l => {
                const majorCode = l.lessonId.substring(0, 3);
                const majorName = majorNames[majorCode] || "기타";
                return `
                    <li data-id="${l.lessonId}">
                        <span class="subjectName"><strong>${l.lessonName}</strong> (${l.lessonId})</span>
                        <div class="subjectInfo" style="display:flex; align-items:center; gap:10px;">
                            <span>${majorName}</span> <span class="dot">·</span>
                            <span>${l.lessonProf || '관리자'} 교수</span> <span class="dot">·</span>
                            <span>${l.lessonPoint || 3}학점</span> <span class="dot">·</span>
                            <span>${l.lessonNow || 0}/${l.lessonMax}명</span>
                            <button class="regbtn" style="margin-left:15px;" onclick="openLectureDetail('${l.lessonId}')">강의계획서</button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        document.getElementById('id-major').addEventListener('change', renderAdminLessonList);

        window.openLectureDetail = (id) => {
            const allLessons = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            const target = allLessons.find(l => l.lessonId === id);
            if (!target) return;

            isEditMode = true;
            editTargetId = id;
            openLayout('add-form');
            document.querySelector('.modal-title').innerText = "강의 관리 (수정/삭제)";

            document.getElementById('modal-major-select').value = target.lessonId.substring(0, 3);
            document.getElementById('modal-req').value = target.lessonId.substring(3, 4);
            document.getElementById('modal-num').value = parseInt(target.lessonId.substring(4, 6));
            document.getElementById('lessonName').value = target.lessonName;
            document.getElementById('lessonMax').value = target.lessonMax;
            document.getElementById('lessonRoom').value = target.lessonRoom || "";
            document.getElementById('lessonGrade').value = target.lessonGrade || "1";
            document.getElementById('lessonDay').value = target.lessonDay || "1";
            document.getElementById('lessonBegin').value = target.lessonBegin || "9";
            document.getElementById('lessonEnd').value = target.lessonEnd || "10";
            document.getElementById('lessonPoint').value = target.lessonPoint || 3;
            document.getElementById('lessonContent').value = target.lessonContent || "";

            document.getElementById('admin-modal-btns').innerHTML = `
                <button type="submit" class="modalbtn primary">정보 수정</button>
                <button type="button" class="modalbtn danger" id="admin-delete-trigger">강의 삭제</button>
                <button type="button" class="modalbtn" onclick="closeModal()">닫기</button>
            `;

            document.getElementById('admin-delete-trigger').onclick = () => {
                openLayout('delete-confirm');
                document.getElementById('delete-target-info').innerText = `과목: ${target.lessonName} (${id})`;
            };
        };

        document.getElementById('execute-delete-btn').onclick = () => {
            let allOpened = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            allOpened = allOpened.filter(l => l.lessonId !== editTargetId);
            localStorage.setItem('openedLessons', JSON.stringify(allOpened));

            let allUsers = JSON.parse(localStorage.getItem('userInfoGroup') || '[]');
            allUsers = allUsers.map(u => {
                if (u.userLessonList) u.userLessonList = u.userLessonList.filter(l => l.lessonId !== editTargetId);
                return u;
            });
            localStorage.setItem('userInfoGroup', JSON.stringify(allUsers));

            closeModal();
            setTimeout(() => {
                showResultModal("삭제 완료", "강의가 삭제되었습니다.");
                renderAdminLessonList();
            }, 200);
        };

        addForm.onsubmit = (e) => {
            e.preventDefault();
            const major = document.getElementById('modal-major-select').value;
            const req = document.getElementById('modal-req').value;
            const num = document.getElementById('modal-num').value.padStart(2, '0');
            const fullId = `${major}${req}${num}`;

            if (!major) { showResultModal("오류", "학과를 선택해주세요."); return; }

            let allOpened = JSON.parse(localStorage.getItem('openedLessons') || '[]');
            let allUsers = JSON.parse(localStorage.getItem('userInfoGroup') || '[]');
            const prev = allOpened.find(l => l.lessonId === editTargetId);

            const newLesson = {
                lessonId: fullId,
                lessonName: document.getElementById('lessonName').value,
                lessonProf: isEditMode ? (prev?.lessonProf || "관리자") : "관리자",
                lessonProfId: isEditMode ? prev?.lessonProfId : 999,
                lessonMajorId: major,
                lessonMax: Number(document.getElementById('lessonMax').value),
                lessonNow: isEditMode ? (prev?.lessonNow || 0) : 0,
                lessonRoom: document.getElementById('lessonRoom').value,
                lessonGrade: Number(document.getElementById('lessonGrade').value),
                lessonDay: Number(document.getElementById('lessonDay').value),
                lessonBegin: Number(document.getElementById('lessonBegin').value),
                lessonEnd: Number(document.getElementById('lessonEnd').value),
                lessonPoint: Number(document.getElementById('lessonPoint').value),
                lessonContent: document.getElementById('lessonContent').value
            };

            if (isEditMode) {
                const idx = allOpened.findIndex(l => l.lessonId === editTargetId);
                if (idx !== -1) allOpened[idx] = newLesson;
                allUsers = allUsers.map(u => {
                    if (u.userLessonList) {
                        const uIdx = u.userLessonList.findIndex(l => l.lessonId === editTargetId);
                        if (uIdx !== -1) u.userLessonList[uIdx] = newLesson;
                    }
                    return u;
                });
            } else {
                allOpened.push(newLesson);
            }

            localStorage.setItem('openedLessons', JSON.stringify(allOpened));
            localStorage.setItem('userInfoGroup', JSON.stringify(allUsers));

            closeModal();
            setTimeout(() => {
                showResultModal("성공", "강의 정보가 반영되었습니다.");
                renderAdminLessonList();
            }, 200);
        };

        window.onload = () => {
            const b = document.getElementById('lessonBegin'), e = document.getElementById('lessonEnd');
            let opt = '';
            for (let i = 8; i <= 18; i++) opt += `<option value="${i}">${i}:00</option>`;
            b.innerHTML = opt; e.innerHTML = opt;
            renderAdminLessonList();

            fetch("../layout/header.html").then(res => res.text()).then(h => document.body.insertAdjacentHTML("afterbegin", h));
            fetch("../layout/footer.html").then(res => res.text()).then(h => document.body.insertAdjacentHTML("beforeend", h));
            fetch("../layout/mypage_sidebar.html").then(res => res.text()).then(html => {
                document.querySelector('main').insertAdjacentHTML("afterbegin", html);
                const user = JSON.parse(localStorage.getItem('user'));
                if (user) {
                    document.getElementById('info-name').innerText = `이름: ${user.userName}`;
                    document.getElementById('info-id').innerText = `사번: ${user.userId}`;
                    const gradeEl = document.getElementById('info-grade');
                    if (gradeEl) { gradeEl.innerText = "직책: 관리자"; gradeEl.style.display = "block"; }
                }
            });

            document.getElementById('btn-add-main').onclick = () => {
                isEditMode = false; editTargetId = null;
                openLayout('add-form');
                document.querySelector('.modal-title').innerText = "새 강의 직접 개설";
                document.getElementById('modal-major-select').value = "";
            };
        };
    </script>
</body>

</html>
