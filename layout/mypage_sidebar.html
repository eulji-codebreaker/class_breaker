    <script>
        /**
         * 페이지 이동 함수
         * 1. layout 폴더에서 한 단계 나가기 (../)
         * 2. lectureRoom 폴더로 들어가기 (lectureRoom/)
         * 3. index.html 파일 열기
         */
        function goToLecture() {
            console.log("이동 시도 중...");
            const targetPath = "../lectureRoom/index.html";

            try {
                // 일반적인 페이지 이동
                window.location.href = targetPath;

                // 만약 iframe 안에서 실행 중이라 메인 화면이 안 바뀐다면 아래 주석을 해제하세요.
                // parent.location.href = targetPath;
            } catch (e) {
                console.error("이동 중 에러 발생:", e);
            }
        }
    </script>
