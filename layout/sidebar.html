<body>
    <aside>
        <div class="menu menu1">
            <select>
                <option disabled selected hidden>강의실 선택</option>
                <option>운영체제</option>
                <option>사회와 마케팅</option>
                <option>웹프로그래밍</option>
                <option>인공지능캡스톤</option>
            </select>
        </div>
        <div class="menu menu2 hover">마이페이지</div>
        <div class="menu menu3 hover">강의실</div>
        <div class="menu menu4 hover">수강신청</div>
        <div class="menu menu5 hover">수강신청</div>
        <div class="menu menu6 hover">공지사항</div>

    <script>
        var userInfo=JSON.parse(localStorage.getItem('user'));
        // currentUserInfo;
        const change=()=>{
        if(localStorage.getItem('pageNow')==="lectureroom"){
            // document.querySelector('.menu1').style.backgroundColor='red';
            document.querySelector('.menu2').classList.add('dontHover');
            var temp=document.querySelector('.menu1 select option:checked');
            document.querySelector('.menu2').innerText=`${temp.innerText}`;
            document.querySelector('.menu2').classList.remove('hover');
            document.querySelector('.menu3').classList.remove('hover');
            var user=JSON.parse(localStorage.getItem('user'));
            document.querySelector('.menu3').innerText=`${user.userName}님`;
            document.querySelector('.menu4').innerText='마이페이지';
            document.querySelector('.menu5').innerText='강의실';
            document.querySelector('.menu6').innerText='수강신청';
        }
        if(localStorage.getItem('pageNow')==='register'){
            document.querySelector('.dontHover').style.display='none';
            document.querySelector('.menu2').style.display='none';
            document.querySelector('.menu3').innerText='공지사항';
            document.querySelector('.menu4').innerText='마이페이지';
            document.querySelector('.menu5').innerText='강의실';
            document.querySelector('.menu6').innerText='수강신청';
            
        }}
        change();
